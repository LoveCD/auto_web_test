<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2E Bootstrap Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10141f;
      color: #f2f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    main {
      width: min(720px, 92vw);
      padding: 24px;
      border: 1px solid #2a3348;
      border-radius: 12px;
      background: #171d2b;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0;
      line-height: 1.5;
      color: #c8cfdb;
    }
  </style>
</head>
<body>
  <main>
    <h1>E2E Bootstrap Ready</h1>
    <p>If you can see this page, the local web server bootstrap works.</p>
  </main>
</body>
</html>
